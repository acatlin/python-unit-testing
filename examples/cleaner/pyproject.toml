[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleaner"
version = "0.1.0"
description = "Small data-cleaning helpers"
requires-python = ">=3.11"
dependencies = ["pandas"]

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
