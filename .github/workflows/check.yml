name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Quizzes and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_site.py

  examples:
    name: Example Python code (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Lesson 5 package as the lesson does
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e examples/cleaner --group examples/cleaner/pyproject.toml:dev
      - run: python tools/run_examples.py

  notebooks:
    # Python 3.13 on Linux is what Google Colab runs (see RESOURCES.md).
    name: Colab notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install what runs a notebook (each notebook installs pandas and pytest itself)
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbclient ipykernel
      - run: python tools/check_notebooks.py
