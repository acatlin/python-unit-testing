name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Quizzes and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_site.py

  examples:
    # pandas 2.2.3 is what the pages quote and what Colab ships; it has no
    # build for Python 3.14. A student's own computer gets the newest pandas,
    # so that is tested too.
    name: Example Python code (${{ matrix.python-version }}, ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pandas: "pandas==2.2.3"
          - python-version: "3.13"
            pandas: "pandas==2.2.3"
          - python-version: "3.14"
            pandas: "pandas"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pandas, then the Lesson 5 package as the lesson does
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.pandas }}"
          python -m pip install -e examples/cleaner --group examples/cleaner/pyproject.toml:dev
          python -c "import pandas; print('pandas', pandas.__version__)"
      - run: python tools/run_examples.py

  notebooks:
    # Python 3.13 on Linux is what Google Colab runs (see RESOURCES.md).
    name: Colab notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install what runs a notebook (each notebook's first cell installs pandas 2.2.3 and pytest itself)
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbclient ipykernel
      - run: python tools/check_notebooks.py
